name: Informar de un error
description: Algo no funciona como debería.
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Si es un **fallo de seguridad**, no lo publiques aquí: usa **Security → Report a vulnerability**.
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué ha pasado?
      description: Describe el error y lo que esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre una hoja de cálculo
        2. Escribe =SUMA(A1:A3) en B1
        3. …
    validations:
      required: true
  - type: dropdown
    id: herramienta
    attributes:
      label: ¿En qué parte de la app?
      options:
        - Documentos
        - Hojas de cálculo
        - Presentaciones
        - Notas
        - Asistente de IA
        - Inicio, configuración o actualizaciones
        - Otra
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Lumen Office
      description: Está en Configuración → Acerca de.
      placeholder: "0.9.7"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: Windows 11
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o archivo de ejemplo
      description: Si puedes, arrastra aquí una captura o un archivo que reproduzca el error (sin datos personales).
